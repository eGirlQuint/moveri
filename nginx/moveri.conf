# nginx reverse-proxy in front of the Moveri Next.js app, deployed behind
# Cloudflare. Unlike the old static build, this now requires `next start`
# to be running as a persistent process (see systemd unit below) — nginx no
# longer serves files directly, it proxies to that process.
#
# Usage:
#   1. Build:   npm run build
#   2. Run:     npm start   (or via the systemd unit below) — listens on :3000
#   3. Put this file at /etc/nginx/sites-available/moveri.conf and symlink
#      it into sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# Cloudflare SSL mode: use "Full (strict)" with a free Cloudflare Origin CA
# certificate on this server (Cloudflare dashboard -> SSL/TLS -> Origin
# Server). That keeps the Cloudflare-to-origin hop encrypted and verified,
# unlike "Flexible" mode. Point the TLS block below at that cert/key and
# redirect plain :80 to :443.

# Restores real visitor IPs from Cloudflare's CF-Connecting-IP header into
# $remote_addr, which is then forwarded to Next.js as X-Real-IP below — the
# /api/contact rate limiter depends on this being correct. Ranges from
# https://www.cloudflare.com/ips/ — re-check occasionally, they change rarely
# but do change.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

upstream moveri_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name moveri.eu www.moveri.eu;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        proxy_pass http://moveri_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
